<section class="section-hero overlay inner-page bg-image" style="background-image: url('/assets/images/hero_1.jpg');" id="home-section">
    <div class="container">
      <div class="row">
        <div class="col-md-7">
          <h1 class="text-white font-weight-bold">Permission Acceess</h1>
          <div class="custom-breadcrumbs">
            <a routerLink="/home">Home</a> <span class="mx-2 slash">/</span>
            <span class="text-white"><strong>Permission Acceess</strong></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  
  <section class="site-section">
    <div class="container">
      
      <!-- roles-management.component.html -->
      <div class="container-fluid mt-3">
        <div class="row">
          <!-- Contenu principal -->
          <main class="col">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h4 class="mb-0">Permission Acceess</h4>
              <button class="btn btn-sm btn-primary">Add Module</button>
            </div>
            <!--
              <div class="row form-group">
                <div class="col-md-12 mb-3 mb-md-0">
                  <label class="text-black">Roles</label>
                      <select [(ngModel)]="selectedidRole" name="rls" class="form-select">
                        <option *ngFor="let role of rolesList" [value]=" role.name " name="rl">{{ role.roles }}</option>
                      </select>
                </div>
              </div>
            -->
            
            <div class="table-responsive">
              <table class="table table-bordered align-middle">
                
                <thead class="table-light">
                  <tr name="roles">
                    <th style="width: 20%;">Module</th>
                    <th class="text-center" *ngFor="let role of rolesList">{{ role.roles }}</th>
                  </tr>
                </thead>
                
                <tbody>
                  
                  <!-- Exemple ligne -->
                  <tr *ngFor="let pg of pagesList">
                    <th>{{ pg.nompage }}</th>
                    <td class="text-center" *ngFor="let r of rolesList">
                      <div class="d-flex flex-wrap gap-2 justify-content-center">
                        <div class="form-check form-check-inline">
                          <input class="form-check-input" type="checkbox" 
                          [id]="'perm-' + pg.nompage + '-role-' + r.idRole"
                          [checked]="isPageRoleChecked(pg, r.idRole)"
                          (change)="onCheckboxChange($event, pg.nompage, r.idRole)">
                        </div>
                      </div>
                      </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="text-end mt-3">
              <button class="btn btn-success">Enregistrer</button>
            </div>
          </main>
        </div>
      </div>


  </div>
</section>
