  <div class="col-lg-6 mb-5">
      <h2 class="mb-4">Update User</h2>
      <form #updateForm="ngForm"  (ngSubmit)="onSubmit()" class="p-4 border rounded">
        <div class="row form-group">
          <div class="col-md-12 mb-3 mb-md-0">
            <label class="text-black">Name</label>
            <input type="text" class="form-control" placeholder="newnm" [(ngModel)]="newnm" [ngModelOptions]="{standalone: true}" name="nm">
          </div>
        </div>
        <div class="row form-group">
          <div class="col-md-12 mb-3 mb-md-0">
            <label class="text-black">Email</label>
            <input type="email" class="form-control" placeholder="Email address" name="newmail" [(ngModel)]="newmail" [ngModelOptions]="{standalone: true}">
          </div>
        </div>
       <!-- <div class="row form-group">
          <div class="col-md-12 mb-3 mb-md-0">
            <label class="text-black">Roles</label>
            <select [(ngModel)]="this.rls" name="rls"  data-style="btn-white btn-lg" data-width="100%" data-live-search="true" title="Select Roles" class="form-select">
                <option *ngFor="let role of rolesList" [value]="role.roles">{{ role.roles }}</option>
              </select>
          </div>
        </div>
        -->
        <div class="row form-group">
          <div class="col-md-12 mb-3 mb-md-0">
            <label class="text-black">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Password" [(ngModel)]="newmdp" [ngModelOptions]="{standalone: true}" name="mdp">
          </div>
        </div>
        <div class="row form-group">
          <div class="col-md-12">
            <input type="submit" value="Update" class="btn px-4 btn-primary text-white">
          </div>
        </div>
      </form>
  </div>
