    <section class="section-hero overlay inner-page bg-image" style="background-image: url('/assets/images/hero_1.jpg');" id="home-section">
      <div class="container">
        <div class="row">
          <div class="col-md-7">
            <h1 class="text-white font-weight-bold">Sign Up</h1>
            <div class="custom-breadcrumbs">
              <a routerLink="/home">Home</a> <span class="mx-2 slash">/</span>
              <span class="text-white"><strong>Sign Up</strong></span>
            </div>
          </div>
        </div>
      </div>
    </section>
    
    <section class="site-section"> 
      <div class="container">
        <div class="row">
          <div class="col-lg-6 mb-5">

      <form #registerForm="ngForm"  (ngSubmit)="onSubmit()" class="p-4 border rounded mb-3">
        <div class="row form-group">
          <div class="col-md-12 mb-3 mb-md-0">
            <label class="text-black">Name</label>
            <input type="text" class="form-control" placeholder="Name" [(ngModel)]="this.nm" [ngModelOptions]="{standalone: true}" name="nm">
          </div>
        </div>
        <div class="row form-group">
          <div class="col-md-12 mb-3 mb-md-0">
            <label class="text-black">Email</label>
            <input type="email" class="form-control" placeholder="Email address" name="mail" [(ngModel)]="this.mail" [ngModelOptions]="{standalone: true}">
          </div>
        </div>
        <div class="row form-group">
          <div class="col-md-12 mb-3 mb-md-0">
            <label class="text-black">Roles</label>
            <select [(ngModel)]="this.rls" name="rls"  data-style="btn-white btn-lg" data-width="100%" data-live-search="true" title="Select Roles" class="form-select">
                <option *ngFor="let role of rolesList" [value]="role.roles">{{ role.roles }}</option>
              </select>
          </div>
        </div>
        
        <div class="row form-group">
          <div class="col-md-12 mb-3 mb-md-0">
            <label class="text-black">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Password" [(ngModel)]="this.mdp" [ngModelOptions]="{standalone: true}" name="mdp">
          </div>
        </div>
        <div class="row form-group">
          <div class="col-md-12">
            <input type="submit" value="Sign Up" class="btn px-4 btn-primary text-white">
          </div>
        </div>
      </form>
  </div>
        </div>
      </div>
    </section>
