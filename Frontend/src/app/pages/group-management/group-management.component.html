<section class="section-hero overlay inner-page bg-image" style="background-image: url('/assets/images/hero_1.jpg');" id="home-section">
    <div class="container">
      <div class="row">
        <div class="col-md-7">
          <h1 class="text-white font-weight-bold">Role</h1>

          <div class="custom-breadcrumbs">
            <a routerLink="/home">Home</a> <span class="mx-2 slash">/</span>
            <span class="text-white"><strong>Users &Management</strong></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  
  <section class="site-section">
    <div class="container">

<div class="container py-4">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h1 class="h4 mb-1">Users &amp; Permission</h1>
      <p class="text-muted small mb-0">Create, view &amp; modify your roles &amp; permission</p>
    </div>
    <button class="btn btn-primary" (click)="onSubmit2()">Add User</button>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">

      <!-- Toolbar -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h6 mb-0">Roles</h2>
        <div class="d-flex gap-2">
          <input type="search" class="form-control form-control-sm" placeholder="Search">
          <button class="btn btn-outline-secondary btn-sm">Filters</button>
        </div>
      </div>

      <!-- Table si on a des rôles -->
    <table *ngIf="users.length" class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>User</th>
          <th>Email</th>
          <th>Role</th>
          <th>More</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of users">
          <td>{{ u.nom }}</td>
          <td>{{ u.email }}</td>
          <td>{{ u.role }}</td>
          <td>
            <button (click)="onSubmit(u.id)" class="btn p-1 d-flex flex-column align-items-center justify-content-center" aria-label="Options">
              <span class="bg-dark rounded-circle mb-1" style="width:4px;height:4px;"></span>
              <span class="bg-dark rounded-circle mb-1" style="width:4px;height:4px;"></span>
              <span class="bg-dark rounded-circle" style="width:4px;height:4px;"></span>
            </button>
          </td>
        </tr>
      </tbody>
    </table>

      //Empty state

        <div class="display-3 text-secondary mb-3">🔍</div>

          Click on Add Role button to start adding new roles

        <button class="btn btn-primary btn-sm">Add Role</button>
      </div>

      //Loader
      <div class="text-center py-5">
        Loading...
      </div>
      --> 

    </div>
  </div>
</div>
</div>


</section>
